name: Deploy to Firebase Hosting on release
on:
  push:
    branches-ignore:
      - "*"
    tags:
      - v*
  workflow_dispatch:

  
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_CHANGESETS_APP }}
          channelId: live
          projectId: changesets-app
